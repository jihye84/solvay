<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
<script>
/* 카카오톡·네이버·페이스북·인스타그램·라인·밴드 등 앱 안 브라우저로 열리면 기본 브라우저(크롬·사파리)로 다시 열기 */
(function () {
  if (window.top !== window.self) return;
  var ua = navigator.userAgent || '';
  var url = location.href;
  var inApp = /KAKAOTALK|KAKAOSTORY|NAVER\(inapp|NAVER\/|FBAN|FBAV|FB_IAB|FBIOS|Instagram|\bLine\/|DaumApps|BAND\/|everytimeApp|Whale\/[\d.]+ .*inapp|; wv\)/i.test(ua);
  if (!inApp) return;
  if (/KAKAOTALK/i.test(ua)) { location.href = 'kakaotalk://web/openExternal?url=' + encodeURIComponent(url); return; }
  if (/\bLine\//i.test(ua)) {
    if (url.indexOf('openExternalBrowser=1') < 0) location.href = url + (url.indexOf('?') < 0 ? '?' : '&') + 'openExternalBrowser=1';
    return;
  }
  if (/Android/i.test(ua)) {
    location.href = 'intent://' + url.replace(/^https?:\/\//, '') + '#Intent;scheme=https;package=com.android.chrome;end';
    return;
  }
  // 아이폰의 앱 안 브라우저는 사파리로 바로 넘길 수 없어 안내 화면을 띄움
  document.addEventListener('DOMContentLoaded', function () {
    var box = document.createElement('div');
    box.setAttribute('role', 'dialog');
    box.style.cssText = 'position:fixed;inset:0;z-index:2147483647;background:rgba(20,24,32,.94);color:#f2f3f6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center;font:15px/1.6 -apple-system,system-ui,sans-serif;word-break:keep-all';
    box.innerHTML = '<strong style="font-size:18px">사파리에서 열어 주세요</strong>' +
      '<span>이 앱 안의 브라우저에서는 소리나 화면이 제대로 작동하지 않을 수 있어요.<br>오른쪽 아래 ⋯ 또는 공유 버튼에서 <b>Safari로 열기</b>를 눌러 주세요.</span>' +
      '<button type="button" data-a="copy" style="font:inherit;padding:10px 20px;border-radius:999px;border:0;background:#f2f3f6;color:#141820">주소 복사</button>' +
      '<button type="button" data-a="stay" style="font:inherit;background:none;border:0;color:#aab0bd;text-decoration:underline">그냥 여기서 보기</button>';
    box.addEventListener('click', function (e) {
      var a = e.target.getAttribute && e.target.getAttribute('data-a');
      if (a === 'stay') box.remove();
      if (a === 'copy') {
        var b = e.target;
        (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(
          function () { b.textContent = '복사했어요'; },
          function () { window.prompt('주소를 복사해 사파리에 붙여 넣어 주세요', url); });
      }
    });
    document.body.appendChild(box);
  });
})();
</script>
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>제5차 솔베이 물리학 회의 (1927)</title>
    <meta name="description" content="1927년 제5차 솔베이 물리학 회의 유명 단체사진 인터랙티브 뷰어. 29명의 천재 물리학자들을 만나보세요.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Noto+Serif+KR:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="icon" type="image/png" href="파비콘.png">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Header -->
    <header id="app-header">
        <h1>제5차 솔베이 물리학 회의 (1927년)</h1>
        <p class="subtitle">Cinquième Conseil de Physique Solvay — <em>전자와 광자</em> — 1927, 브뤼셀</p>
    </header>

    <!-- Button Group (Mode Selector + TTS) -->
    <div id="btn-group">
        <!-- 모드 선택 버튼: 현재 모드의 반대 버튼만 표시 -->
        <div id="mode-btns">
            <button id="mode-game" title="게임 모드로 전환">
                <span class="mode-icon">🏆</span>
                <span class="mode-label">게임</span>
            </button>
            <button id="mode-desc" title="설명 모드로 전환" class="hidden">
                <span class="mode-icon">📖</span>
                <span class="mode-label">설명</span>
            </button>
        </div>
        <!-- 음성 버튼 -->
        <button id="tts-toggle" title="음성 읽기 ON/OFF" class="tts-on">
            <span class="tts-icon">🔊</span>
            <span class="tts-label">음성</span>
        </button>
    </div>

    <!-- Zoom Controls -->
    <div id="zoom-controls">
        <button id="zoom-in" title="확대">+</button>
        <button id="zoom-reset" title="원래 크기">⟳</button>
        <button id="zoom-out" title="축소">−</button>
    </div>

    <!-- Help hint -->
    <div id="help-hint">
        <span class="desktop-hint">🖱️ 스크롤: 확대/축소 &nbsp;|&nbsp; 드래그: 이동 &nbsp;|&nbsp; 롤오버: 이름 &nbsp;|&nbsp; 클릭:
            상세정보</span>
        <span class="mobile-hint">👆 탭: 이름 &nbsp;|&nbsp; 다시 탭: 상세정보 &nbsp;|&nbsp; 핀치: 확대/축소 &nbsp;|&nbsp; 드래그: 이동</span>
    </div>

    <!-- Photo Viewport -->
    <div id="viewport">
        <div id="canvas">
            <img id="photo" src="https://upload.wikimedia.org/wikipedia/commons/6/6e/Solvay_conference_1927.jpg"
                alt="1927 Solvay Conference Group Photo" draggable="false">
            <div id="hotspots"></div>
        </div>
    </div>

    <!-- Tooltip -->
    <div id="tooltip" class="hidden"></div>

    <!-- Info Panel -->
    <div id="info-panel" class="hidden">
        <button id="close-panel" title="닫기">✕</button>
        <div id="info-content">
            <h2 id="info-name"></h2>
            <p id="info-years"></p>
            <p id="info-desc"></p>
        </div>
    </div>

    <!-- Game Panel -->
    <div id="game-panel" class="hidden">
        <div id="game-status">
            <span id="game-round-display">1 / 10</span>
            <span id="game-score-display">0점</span>
        </div>
        <p id="game-prompt">사진에서 이 인물을 찾아 클릭하세요</p>
        <h2 id="game-name"></h2>
        <p id="game-feedback" class="hidden"></p>
        <p id="game-desc" class="hidden"></p>
        <button id="game-next" class="hidden">다음 문제 ▶</button>
    </div>

    <!-- Game Result Modal -->
    <div id="game-result" class="hidden">
        <div id="game-result-box">
            <h2 id="game-result-title">게임 종료</h2>
            <p id="game-result-score"></p>
            <div id="game-wrong-list"></div>
            <div id="game-result-buttons">
                <button id="game-retry">📝 틀린 문제 다시 풀기</button>
                <button id="game-restart">🔄 새 게임 하기</button>
                <button id="game-exit">📖 설명 모드로</button>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
